<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    color: #172033;
    background:
        radial-gradient(circle at 5% 10%, #d7f9e5 0, transparent 24%),
        radial-gradient(circle at 95% 10%, #cfe9ff 0, transparent 25%),
        radial-gradient(circle at 90% 90%, #e5d8ff 0, transparent 28%),
        linear-gradient(135deg, #f4fff8, #f4f8ff);
    display: flex;
    flex-direction: column;
}

.top-bar {
    height: 8px;
    background: linear-gradient(
        90deg,
        #16a05d,
        #43c979,
        #65b8ff,
        #7657d9,
        #ff6b8a
    );
}

header {
    text-align: center;
    padding: 28px 20px 12px;
}

.badge {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 30px;
    background: white;
    color: #17834e;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
    box-shadow: 0 5px 20px rgba(30, 100, 70, 0.09);
    margin-bottom: 12px;
}

header h1 {
    font-size: clamp(30px, 5vw, 48px);
    background: linear-gradient(90deg, #168b51, #267fc2, #7657d9);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}

header p {
    color: #656d7d;
    font-size: 15px;
}

.quiz-wrapper {
    width: min(850px, 92%);
    margin: 20px auto 90px;
    flex: 1;
}

.score-area {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.progress-text,
.score {
    background: rgba(255,255,255,0.88);
    padding: 10px 17px;
    border-radius: 14px;
    font-weight: 750;
    box-shadow: 0 7px 25px rgba(40,60,100,0.08);
}

.progress-text {
    color: #2478b5;
}

.score {
    color: #168b51;
}

.progress-bar {
    height: 9px;
    background: rgba(255,255,255,0.8);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 22px;
}

.progress-fill {
    height: 100%;
    width: 2%;
    border-radius: 20px;
    background: linear-gradient(90deg, #16a05d, #4aa9e8, #7657d9);
    transition: width 0.5s ease;
}

.quiz-card {
    position: relative;
    background: rgba(255,255,255,0.91);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.95);
    border-radius: 28px;
    padding: clamp(25px, 5vw, 48px);
    box-shadow: 0 20px 60px rgba(40,70,100,0.13);
    overflow: hidden;
}

.quiz-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(
        90deg,
        #16a05d,
        #5bc0eb,
        #7657d9,
        #ff668c
    );
}

.question-number {
    color: #7a8395;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 18px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.question {
    font-size: clamp(21px, 4vw, 31px);
    line-height: 1.4;
    font-weight: 750;
    margin-bottom: 32px;
    color: #20283a;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.option {
    border: 2px solid #e9edf3;
    background: #ffffff;
    color: #30394a;
    padding: 17px 20px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 650;
    text-align: left;
    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
}

.option:hover:not(:disabled) {
    transform: translateY(-3px);
    border-color: #8bcfaf;
    box-shadow: 0 8px 20px rgba(40,120,80,0.12);
    background: #f8fffb;
}

.option:disabled {
    cursor: default;
}

.option.correct {
    background: #d9f8e7;
    border-color: #43c985;
    color: #197747;
    animation: correctPop 0.35s ease;
}

.option.incorrect {
    background: #ffe0e8;
    border-color: #ef6687;
    color: #b52f52;
    animation: wrongShake 0.4s ease;
}

.option.show-correct {
    background: #d9f8e7;
    border-color: #43c985;
    color: #197747;
}

.feedback {
    min-height: 28px;
    margin-top: 20px;
    font-weight: 700;
    font-size: 15px;
}

.feedback.correct-text {
    color: #23945c;
}

.feedback.wrong-text {
    color: #d74468;
}

.next-container {
    display: flex;
    justify-content: flex-end;
    margin-top: 12px;
}

.next-btn,
.restart-btn {
    border: none;
    padding: 14px 25px;
    border-radius: 14px;
    background: linear-gradient(135deg, #168b51, #287fc2);
    color: white;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(30,100,130,0.22);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.next-btn:hover,
.restart-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(30,100,130,0.3);
}

.next-btn {
    display: none;
}

.screen-transition-out {
    animation: slideOut 0.28s ease forwards;
}

.screen-transition-in {
    animation: slideIn 0.4s ease forwards;
}

.results {
    display: none;
    text-align: center;
    padding: 20px 0;
}

.results-icon {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #b8f1cf, #b8dcff);
    font-size: 38px;
    font-weight: 900;
    color: #168b51;
    animation: resultBounce 1s ease;
}

.results h2 {

    background: linear-gradient(90deg, #168b51, #287fc2, #7657d9);

    -webkit-text-fill-color: transparent;
}

.final-score {
    font-size: 64px;
    font-weight: 850;
    color: #168b51;
    margin: 10px 0;
}

.out-of {
    color: #777d8b;
    font-weight: 650;
    margin-bottom: 20px;
}

.result-message {
    color: #575f70;
    font-size: 17px;
    line-height: 1.6;
    max-width: 600px;
    margin: 0 auto 28px;
}

.score-bar-final {
    height: 13px;
    max-width: 550px;
    margin: 0 auto 30px;
    background: #e9edf4;
    border-radius: 20px;
    overflow: hidden;
}

.score-bar-final-fill {
    width: 0;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(
        90deg,
        #16a05d,
        #5bc0eb,
        #7657d9
    );
    transition: width 1.2s ease;
}

footer {
    text-align: center;
    padding: 17px 15px;
    background: rgba(255,255,255,0.78);
    border-top: 1px solid rgba(100,130,150,0.12);
    color: #686f7d;
    font-size: 13px;
    font-weight: 650;
}

footer strong {
    color: #168b51;
}

@keyframes slideOut {
    from {
        opacity: 1;
        transform: translateX(0);
    }

    to {
        opacity: 0;
        transform: translateX(-45px);
    }
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateX(45px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes correctPop {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.025);
    }

    100% {
        transform: scale(1);
    }
}

@keyframes wrongShake {
    0%, 100% {
        transform: translateX(0);
    }

    25% {
        transform: translateX(-5px);
    }

    75% {
        transform: translateX(5px);
    }
}

@keyframes resultBounce {
    0% {
        transform: scale(0.5);
        opacity: 0;
    }

    70% {
        transform: scale(1.08);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

@media (max-width: 600px) {

    header {
        padding-top: 20px;
    }

    .quiz-wrapper {
        width: 94%;
        margin-top: 12px;
    }

    .score-area {
        font-size: 13px;
    }

    .score,
    .progress-text {
        padding: 8px 12px;
    }

    .options {
        grid-template-columns: 1fr;
    }

    .quiz-card {
        border-radius: 22px;
        padding: 25px 20px;
    }

    .question {
        margin-bottom: 24px;
    }

    .option {
        padding: 15px;
    }

    .next-container {
        justify-content: stretch;
    }

    .next-btn {
        width: 100%;
    }
}
</style>
</head>

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionText =
    document.getElementById("questionText");

const optionsContainer =
    document.getElementById("options");

const feedback =
    document.getElementById("feedback");

const nextBtn =
    document.getElementById("nextBtn");

const progressText =
    document.getElementById("progressText");

const scoreText =
    document.getElementById("scoreText");

const progressFill =
    document.getElementById("progressFill");

const quizScreen =
    document.getElementById("quizScreen");

const resultsScreen =
    document.getElementById("resultsScreen");


function loadQuestion() {

    answered = false;

    const item = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `QUESTION ${currentQuestion + 1}`;

    questionText.textContent = item.q;

    progressText.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    scoreText.textContent =
        `Score: ${score}`;

    progressFill.style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

    feedback.textContent = "";
    feedback.className = "feedback";

    nextBtn.style.display = "none";

    optionsContainer.innerHTML = "";

    item.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent = option;

        button.addEventListener(
            "click",
            () => selectAnswer(button, index)
        );

        optionsContainer.appendChild(button);
    });
}


function selectAnswer(button, selectedIndex) {

    if (answered) return;

    answered = true;

    const item = questions[currentQuestion];

    const allOptions =
        document.querySelectorAll(".option");

    allOptions.forEach(option => {
        option.disabled = true;
    });

    if (selectedIndex === item.answer) {

        score++;

        button.classList.add("correct");

        feedback.textContent =
            "Correct. Excellent football grammar.";

        feedback.classList.add("correct-text");

    } else {

        button.classList.add("incorrect");

        allOptions[item.answer]
            .classList.add("show-correct");

        feedback.textContent =
            `Not quite. The correct answer is "${item.options[item.answer]}"`;

        feedback.classList.add("wrong-text");
    }

    scoreText.textContent =
        `Score: ${score}`;

    nextBtn.style.display = "block";
}


function nextQuestion() {

    if (!answered) return;

    quizScreen.classList.remove(
        "screen-transition-in"
    );

    quizScreen.classList.add(
        "screen-transition-out"
    );

    setTimeout(() => {

        currentQuestion++;

        if (currentQuestion >= questions.length) {

            showResults();

            return;
        }

        quizScreen.classList.remove(
            "screen-transition-out"
        );

        quizScreen.classList.add(
            "screen-transition-in"
        );

        loadQuestion();

    }, 300);
}


function showResults() {

    quizScreen.style.display = "none";

    resultsScreen.style.display = "block";

    document.querySelector(".score-area")
        .style.display = "none";

    document.querySelector(".progress-bar")
        .style.display = "none";

    document.getElementById("finalScore")
        .textContent = score;

    const percentage =
        (score / 50) * 100;

    setTimeout(() => {

        document.getElementById("finalScoreFill")
            .style.width = `${percentage}%`;

    }, 100);

    let message = "";

    if (score === 50) {

        message =
            "Perfect score. Avyan-level football grammar mastery.";

    } else if (score >= 45) {

        message =
            "Outstanding performance. Your grammar was as sharp as a top-class finish.";

    } else if (score >= 40) {

        message =
            "Fantastic work. You clearly know your Question Tags.";

    } else if (score >= 35) {

        message =
            "Great job. Your football grammar skills are looking strong.";

    } else if (score >= 25) {

        message =
            "Good effort. A little more practice and you will be ready for the final.";

    } else {

        message =
            "Keep practising. Even the best footballers need training sessions.";
    }

    document.getElementById("resultMessage")
        .textContent = message;
}


function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    answered = false;

    resultsScreen.style.display = "none";

    quizScreen.style.display = "block";

    document.querySelector(".score-area")
        .style.display = "flex";

    document.querySelector(".progress-bar")
        .style.display = "block";

    document.getElementById("finalScoreFill")
        .style.width = "0%";

    quizScreen.classList.remove(
        "screen-transition-out"
    );

    quizScreen.classList.add(
        "screen-transition-in"
    );

    loadQuestion();
}


loadQuestion();

</script>
